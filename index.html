 },
 en:{
  faq:[
   ['What is Zui To-Do?','Zui To-Do is a task app by Zui System for capturing tasks, setting priorities and tracking daily, weekly, monthly and yearly goals.'],
   ['How do I open the menu?','Tap the Zui To-Do logo at the top left. On wide screens the menu stays on the left and the logo hides or shows it.'],
   ['Is my data on all my devices?','Yes. Tasks, categories, profile and theme are stored in your account and sync automatically when you sign in with the same account.'],
   ['What does "Carried over" mean?','Unfinished tasks with a span (daily, weekly, monthly, yearly) move on to the next period and are marked Carried over, so nothing is lost.'],
   ['How long is the trial?','14 days with every Business feature, followed by a 3-day grace period. Without a subscription your data stays safe but read-only.'],
   ['How do I subscribe?','Open Settings → Manage subscription, choose a plan and duration, pay by QRIS (Rupiah) or DuitNow (Ringgit), then send the reference number. Zui admin activates the plan once payment arrives, usually within 24 hours.'],
   ['Can I change the look?','Yes. Settings → Special theme has ready-made themes. Pro and Business plans can mix their own colors, font, text size and corners.'],
   ['How do I contact Zui System?','Via Settings → Feedback: email '+CONTACT+' or chat with the admin directly.']
  ],
  terms:[
   ['','These terms govern your use of the Zui To-Do app (“the service”), managed by Zui System, PT. Zaor Utama Indonesia (“we”). By creating an account or using the service, you agree to these terms.'],
   ['1. Our service',['Zui To-Do is a web app for capturing and organizing personal tasks, stored in your account and synced across every device you sign in on:','- Tasks: title, notes, priority, category, due date, and tasks with a span (daily, weekly, monthly, yearly). Unfinished tasks with a span move on to the next period as Carried over.','- Views: Today, Board, Calendar, and Summary.','- Goals: daily, weekly, monthly, and yearly task goals.','- Profile and themes: personal profile, ready-made themes, and custom themes (on some plans).','- Data: export tasks to CSV, and back up and restore data (JSON), depending on your plan.','- Help: chat with Zui admin and subscription requests.','We may add, change, or retire features from time to time.']],
   ['2. Account and security',['- You must be at least 18, or have consent from a parent or guardian if you are under 18.','- You must give a correct name and email so your account can be recovered.','- One account per person. Do not share your account with others.','- Keep your password secret. You are responsible for all activity on your account.','- Contact us right away if you think someone else is using your account.']],
   ['3. Plans and features',['Every account is on one of these plans:','- Starter: all views (Today, Board, Calendar, Summary), daily to yearly goals, sync across devices, 8 ready-made themes, and up to 5 categories.','- Pro: everything in Starter, up to 50 categories, custom themes (colors, font, text size, corners), and task export to CSV.','- Business: everything in Pro, data backup and restore (JSON), and priority admin chat replies.','If you move to a lower plan, features outside that plan are locked, but your existing data stays stored.']],
   ['4. Trial and subscription',['- New accounts get a free 14-day trial with every Business feature.','- After the trial, you can choose Starter, Pro, or Business for 1 month, 6 months, or 1 year. Prices are per account and shown in Settings → Manage subscription in Rupiah or Ringgit.','- Prices may change. Price changes do not affect periods already paid.','- Pay by QRIS (Rupiah) or DuitNow (Ringgit) to the code shown in Manage subscription. After paying, enter the reference number from your receipt and send it from that page. You can also send a photo of the receipt in the admin chat.','- We check the payment and activate the subscription manually, usually within 24 hours. Activation depends on service hours and is not guaranteed to be instant. Paid time is added from your current end date, or from the activation day if your access has already ended.','- Subscriptions do not renew automatically.','- When a trial or subscription ends, there is a 3-day grace period. After that your tasks and data are read-only until a subscription is active. Your data stays stored.','- An active subscription cannot be cancelled and its payment cannot be refunded, except for payment errors under the Refund Policy.']],
   ['5. Your data','The data you enter, such as tasks, categories, goals, and profile, remains yours. We only use it to run the service as described in the Privacy Policy. You are responsible for what you record and for having the right to store it, including when your tasks contain other people’s data. We recommend backing up your data regularly.'],
   ['6. Prohibited use',['- Using the service to store or share unlawful content, or entering other people’s data without the right to do so.','- Trying to open other users’ data, break security, or disrupt the service.','- Sending reference numbers or receipts that are forged, altered, or reused.','- Copying, reselling, or renting out access to the service without our written permission.']],
   ['7. Availability','We work to keep the service available but cannot guarantee it is uninterrupted. Maintenance, updates, network problems, or infrastructure provider outages may make the service or sync temporarily unavailable.'],
   ['8. Limitation of liability','Zui To-Do is a note-keeping aid. Reminders, goals, and summaries are calculated from the data you enter. To the extent permitted by law, we are not liable for indirect losses, lost profits, missed tasks or deadlines, or losses caused by incorrect data. Our total liability for any one dispute does not exceed what you paid for your subscription in the last 3 months.'],
   ['9. Termination','You can stop using the service at any time by not renewing, deleting your tasks and profile data in the app, or asking us to delete your account and all its data at '+SUPPORT+'. We may suspend or close accounts that break these terms, with notice where possible.'],
   ['10. Changes to these terms','We may update these terms. We will announce important changes in the service or by email. The effective date above shows the latest version.'],
   ['11. Governing law','These terms are governed by the laws of the Republic of Indonesia. Disputes are first settled by discussion and, failing that, through the Pamekasan District Court (Pengadilan Negeri Pamekasan).'],
   ['12. Contact us','See Settings → Contact & Address.']
  ],
  privacy:[
   ['','This policy explains what data Zui To-Do collects, why, and how you can control it. We follow Indonesian Law No. 27 of 2022 on Personal Data Protection.'],
   ['1. Data we collect',['- Account data: name, email, and password. Passwords are handled by Firebase Authentication and we cannot see them. If you sign in with Google, we receive your Google account name and email.','- Profile (optional): full name, nickname, username, date of birth, gender, phone, city or country, job title, organization or school, bio, profile photo, daily task goal, and reminder time. Every field may be left empty.','- Data you enter: tasks with their notes, priority, due date, and status, categories, and goals.','- Settings: language, theme, and custom theme stored in your account.','- Subscription and help: the plan, duration, amount, currency, and payment reference number you send, plus your chats with the admin, including any receipt photos you attach.','- On-device storage: language, theme, and an offline copy of your data kept in your device’s browser so the app stays fast and works on a weak connection.']],
   ['2. How we use data',['- Running the service, such as saving tasks, syncing data across devices, and showing goals and summaries.','- Verifying your account and helping you reset your password.','- Managing trials and subscriptions, including checking payments.','- Answering your questions, feedback, and help requests.','- Keeping the service secure.','We do not sell personal data and do not use your tasks for advertising.']],
   ['3. Storage and security','Data is stored on Google Firebase (Authentication and Cloud Firestore), so the servers may be outside Indonesia. Your tasks and profile can only be opened by your own account. Connections to the service are encrypted with HTTPS.'],
   ['4. Sharing data',['We only share data with:','- Google, as the provider of storage, sign-in (including Sign in with Google), and fonts (Google Fonts).','- GitHub, as the host of the app pages (GitHub Pages).','- Authorities, when required by law.','The Share with friends button only opens the app you choose (such as WhatsApp, Telegram, or email) with a link to Zui To-Do. Your tasks and profile are not shared.','Zui admin can see your account name and email, subscription status, payment requests, and chats you send. Your tasks, categories, goals, and profile are not shown in the admin panel. Technical staff may open the database through the Firebase console only when needed for maintenance or when you ask for help.']],
   ['5. Your rights','You have the right to request a copy of your personal data, correct wrong data, delete data, and withdraw consent. Most of this you can do yourself in the app, such as editing or deleting tasks and profile, exporting tasks, and downloading a backup depending on your plan. For anything else, including account deletion, email '+SUPPORT+'. We will respond within 14 working days of receiving your request.'],
   ['6. Retention and deletion','Data is kept while your account is active. Tasks and profile data you delete in the app are removed from your account right away. If you ask us to delete your account, the account and all your tasks, categories, goals, profile, and settings are permanently deleted and cannot be recovered. Subscription payment records and help chats, including receipts, are kept as required for bookkeeping and by law, then deleted once no longer needed. Backup copies at our infrastructure provider, if any, are permanently deleted after a limited time. Data stored in your device’s browser can be cleared through your browser settings.'],
   ['7. Other people’s data in your tasks','If you record other people’s data in your tasks, such as a name or phone number, you decide what is recorded and are responsible for it. We process that data on your behalf and only to run the service.'],
   ['8. Minors','Users under 18 may only use the service with consent from a parent or guardian. If you are a parent or guardian and learn that your child gave us data without your consent, contact us so it can be deleted.'],
   ['9. Changes to this policy','If this policy changes, we will update the effective date and announce important changes in the service or by email.'],
   ['10. Contact us','Questions or requests about personal data can be sent to '+SUPPORT+'. The full address is in Settings → Contact & Address.']
  ],
  refund:[
   ['','This policy sets out the refund rules for Zui To-Do subscription payments.'],
   ['','! An active subscription is final. It cannot be cancelled and its payment cannot be refunded, except for the payment errors in section 3.'],
   ['1. Try before you pay','Every new account gets a free 14-day trial with every Business feature, with no payment. We recommend using it to make sure the service and the plan you choose fit your needs before subscribing.'],
   ['2. Plans and prices',['One subscription covers one account.','{prices}','The price that applies is the one shown in Manage subscription when you send your request, including any promotional price. Subscriptions do not renew automatically, so there are no recurring charges without your approval.']],
   ['3. Exception: payment errors',['Refunds only apply to the following payment errors, if requested within 7 days of payment:','- Duplicate payment: you paid twice for the same request. The extra payment is refunded in full.','- Overpayment: you paid more than the plan price. The difference is refunded.','- Subscription not activated: your subscription is not active within 72 hours of sending a correct reference number, and you choose to cancel. The payment is refunded in full.']],
   ['4. Non-refundable payments',['- Active subscriptions, including renewals, for any reason, such as a change of mind or no longer using the service.','- The remaining time if you stop using the service mid-period.','- Moving to a lower plan or a shorter duration during a subscription.','- Accounts closed for breaking the Terms of Service.','- Payments sent anywhere other than the QRIS or DuitNow shown in Manage subscription.','- Requests with forged, altered, or reused reference numbers or receipts.']],
   ['5. How to request',['Email '+SUPPORT+' with the subject “Refund”, or write in the admin chat in Zui To-Do, and include:','- your account email,','- the payment date, amount, and reference number, plus the receipt,','- the reason for your request,','- the bank or e-wallet name, account number, and account holder name to receive the funds.']],
   ['6. Process and timing',['- We reply within 2 working days.','- If approved, funds are sent within 7 to 14 working days to the bank account or e-wallet you provide.','- Refunds for duplicate payments or overpayment do not change an active subscription. For a subscription not yet activated, the request is cancelled and the data in your account stays safe.']]
  ],
  contact:[

function shrinkImg(file,side,max){
  return new Promise(function(ok,no){
    const r=new FileReader();
    r.onload=function(){const im=new Image();im.onload=function(){let s=Math.min(1,side/Math.max(im.width,im.height)),d='';
      for(let i=0;i<6;i++){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);d=c.toDataURL('image/jpeg',.72);if(d.length<=max) break;s*=.8}
      d.length<=max?ok(d):no(new Error('big'))};im.onerror=no;im.src=r.result};
    r.onerror=no;r.readAsDataURL(file);
  });
}

function hx(h){h=String(h||'').replace('#','');if(h.length===3)h=h.split('').map(function(c){return c+c}).join('');const n=parseInt(h,16);return isNaN(n)?[42,79,238]:[n>>16&255,n>>8&255,n&255]}

function mix(a,b,t){const x=hx(a),y=hx(b);return toHex(x.map(function(v,i){return v+(y[i]-v)*t}))}
function lum(h){const c=hx(h).map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}

function applyLook(){
  const r=document.documentElement,st=r.style,e=lookEff(),dk=isDark();

  const isDefault=e.accent.toLowerCase()==='#2a4fee'&&e.mark.toLowerCase()==='#ffd84d'&&e.bg==='plain';
  if(isDefault) return;
  const acc=dk?mix(e.accent,'#ffffff',.42):e.accent;
  st.setProperty('--accent',acc);st.setProperty('--c-kerja',acc);
  st.setProperty('--accent-ink',lum(acc)>.38?'#10131F':'#FFFFFF');

  st.setProperty('--mark',e.mark);st.setProperty('--mark-ink',lum(e.mark)>.4?mix(e.mark,'#000000',.78):'#FFFFFF');
  if(e.bg==='tint'){

function restoreJson(file){
  const r=new FileReader();
  r.onload=function(){
    try{
      const d=JSON.parse(r.result);if(!d||d.app!=='zui-todo'||!Array.isArray(d.tasks)) throw 0;
      if(!canWrite()) return;
      ensureReal();
      if(Array.isArray(d.tags)) d.tags.forEach(function(x){const n=String(x&&x.n||'').trim().slice(0,20);if(n&&TAGS.indexOf(n)<0&&TAGS.length<50){TAGS.push(n);TAGC[n]=/^#[0-9a-f]{6}$/i.test(x.c)||/^var\(--c-\w+\)$/.test(x.c)?x.c:'#2A4FEE'}});
      saveTags();
      let n=0;d.tasks.slice(0,5000).forEach(function(v){const t=norm(v);if(TAGS.indexOf(v.tag)>=0) t.tag=v.tag;const i=S.tasks.findIndex(function(x){return x.id===t.id});if(i>=0) S.tasks[i]=t;else S.tasks.push(t);store.put(t);n++});
      render();renderPanel();toast(n+' '+L('restored'));
    }catch(e){toast(L('badFile'))}
  };
  r.readAsText(file);
}

/* two-step confirm on a button: first click arms it, second click runs it */
function armed(el,label,armedLabel){
  const lbl=el.querySelector('.lbl')||el;
  if(el.dataset.armed) return true;
  el.dataset.armed='1';lbl.textContent=armedLabel;
  setTimeout(function(){if(el.isConnected){delete el.dataset.armed;lbl.textContent=label}},3000);
  return false;
}

}
/* forms are handled by click and Enter, so they also work where the preview blocks native form submission */
document.addEventListener('submit',function(e){const f=e.target; if(f&&f.dataset&&f.dataset.form){e.preventDefault();onForm(f)}});
document.addEventListener('click',function(e){
  const b=e.target.closest&&e.target.closest('button[type="submit"]'); if(!b) return;
  const f=b.closest('form[data-form]'); if(!f) return;
  e.preventDefault();onForm(f);
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||e.isComposing) return;
  const t=e.target; if(!t||t.tagName==='TEXTAREA'||t.tagName==='BUTTON') return;
  const f=t.closest&&t.closest('form[data-form]'); if(!f) return;
  e.preventDefault();onForm(f);
});
document.addEventListener('input',function(e){
  const t=e.target;
  if(t.id==='qa-title'){S.qa.title=t.value}
  else if(t.id==='q'){S.q=t.value;render()}
});
document.addEventListener('change',function(e){
  const t=e.target;
  if(t.form&&t.form.dataset.form==='qa'){
    if(t.name==='prio') S.qa.prio=+t.value;
    else if(t.name==='tag') S.qa.tag=t.value;
    else if(t.name==='due') S.qa.due=t.value;
    else if(t.name==='span') S.qa.span=t.value;
  }
});
let swX=0,swY=0,swOn=false;
document.addEventListener('touchstart',function(e){
  swOn=!!(S.menu&&e.touches.length===1);
  if(swOn){swX=e.touches[0].clientX;swY=e.touches[0].clientY}
},{passive:true});
document.addEventListener('touchend',function(e){
  if(!swOn) return; swOn=false;
  const t=e.changedTouches[0],dx=t.clientX-swX,dy=t.clientY-swY;
  if(dx<-60&&Math.abs(dx)>Math.abs(dy)*1.5&&S.menu) closeMenu(false);
},{passive:true});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape') return;
  if(S.sheet) closeSheet();
  else if(S.panel) closePanel();
  else if(S.menu) closeMenu(true);
});
document.addEventListener('visibilitychange',function(){
  const n=fmt(new Date());
  if(!document.hidden&&n!==TODAY){TODAY=n;render()}
});

/* drag and drop on the board */
document.addEventListener('dragstart',function(e){
  const c=e.target.closest&&e.target.closest('.card'); if(!c) return;
  try{e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move'}catch(x){}
});
document.addEventListener('dragover',function(e){
  const c=e.target.closest&&e.target.closest('.col'); if(!c) return;
  e.preventDefault();
  document.querySelectorAll('.col.over').forEach(function(x){if(x!==c)x.classList.remove('over')});
  c.classList.add('over');
});
document.addEventListener('drop',function(e){
  const c=e.target.closest&&e.target.closest('.col'); if(!c) return;
  e.preventDefault();
  let id='';try{id=e.dataTransfer.getData('text/plain')}catch(x){}
  document.querySelectorAll('.col.over').forEach(function(x){x.classList.remove('over')});
  if(id) setStatus(id,c.dataset.s);
});
document.addEventListener('dragend',function(){document.querySelectorAll('.col.over').forEach(function(x){x.classList.remove('over')})});

/* ---------- start ---------- */
try{const lg=localStorage.getItem('zui-todo:lang');if(lg==='id'||lg==='ms'||lg==='en') S.lang=lg}catch(e){}
try{const th=localStorage.getItem('zui-todo:theme');if(th==='light'||th==='dark'||th==='auto') S.theme=th}catch(e){}
try{if(lget('zui-todo:side')==='0') S.side=false}catch(e){}
try{const cu=localStorage.getItem('zui-todo:cur');if(cu==='IDR'||cu==='MYR') SUB.cur=cu}catch(e){}
setLangWords(S.lang);
applyTheme(S.theme);
try{const dq=window.matchMedia('(prefers-color-scheme: dark)');const g=function(){applyLook()};if(dq.addEventListener) dq.addEventListener('change',g); else if(dq.addListener) dq.addListener(g)}catch(e){}
setInterval(function(){if(S.user&&FB.on){const k=SUB.st.kind;SUB.st=subState();if(SUB.st.kind!==k) render()}},5*60000);
function loadUserData(skipTasks){
  S.profile=profDefaults();
  try{const pf=JSON.parse(localStorage.getItem(K('profile'))||'null');if(pf&&typeof pf==='object') S.profile=Object.assign(profDefaults(),pf)}catch(e){}
  if(S.user){
    if(!S.profile.email) S.profile.email=S.user.email;
    if(!S.profile.name&&S.user.name) S.profile.name=S.user.name;
    if(!S.profile.photo&&S.user.photo) S.profile.photo=S.user.photo;
  }
  saveProfile();
  S.goals={w:15,m:60,y:600};
  try{const gl=JSON.parse(localStorage.getItem(K('goals'))||'null');if(gl) ['w','m','y'].forEach(function(k){if(+gl[k]>0) S.goals[k]=Math.floor(+gl[k])})}catch(e){}
  resetTags();S.qa.tag=TAGS[0];loadTags();
  S.look=Object.assign({},LOOK0);
  try{const lk=JSON.parse(localStorage.getItem(K('look'))||'null');if(lk) S.look=normLook(lk)}catch(e){}
  applyLook();
  if(skipTasks) return;
  const saved=store.lsLoad();
  if(saved&&Array.isArray(saved.tasks)){S.tasks=saved.tasks.map(norm);S.demo=false}
  else{S.tasks=demoTasks();S.demo=true}
}
function restoreLocalSession(){try{const ss=JSON.parse(lget('zui-todo:session')||'null');if(ss&&ss.user&&ss.user.id){S.user=ss.user;loadUserData()}}catch(e){}}
if(!FB.on) restoreLocalSession();
try{const mq=window.matchMedia('(min-width:1100px)');const f=function(){render()};if(mq.addEventListener) mq.addEventListener('change',f); else if(mq.addListener) mq.addListener(f)}catch(e){}
render();
if(FB.on) fbInit().catch(function(e){console.warn('firebase',e);FB.on=false;FB.ready=true;toast(L('fbFail'));authRoot.innerHTML='';restoreLocalSession();render()});
})();
</script>
