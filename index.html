<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Zui To-Do 26.01</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: slim top bar whose logo opens a left drawer (views, categories, settings); one working column. Yellow always means "today". */
:root{
  --bg:#EBEFF8; --surface:#FFFFFF; --surface-2:#F3F5FB; --ink:#121A35; --ink-2:#4C5576; --ink-3:#6F789A; --line:#D9DFEE;
  --accent:#2A4FEE; --accent-ink:#FFFFFF; --accent-soft:#E2E8FF; --mark:#FFD84D; --mark-ink:#3A2E00;
  --good:#13795B; --warn:#A8530B; --bad:#C0283A;
  --c-kerja:#2A4FEE; --c-pribadi:#B8470D; --c-belajar:#0E7A6C;
  --font-display:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(18,26,53,.06),0 6px 20px rgba(18,26,53,.06);
  --scrim:rgba(10,14,30,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1226; --surface:#151B33; --surface-2:#1B2240; --ink:#E9EDFB; --ink-2:#A9B1D1; --ink-3:#8790B3; --line:#2A3358;
    --accent:#8AA2FF; --accent-ink:#0D1226; --accent-soft:#222C57; --mark:#FFD84D; --mark-ink:#2B2200;
    --good:#4FD1A5; --warn:#F0A25A; --bad:#FF7A8A;
    --c-kerja:#8AA2FF; --c-pribadi:#F59E6B; --c-belajar:#4FD1BD;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1226; --surface:#151B33; --surface-2:#1B2240; --ink:#E9EDFB; --ink-2:#A9B1D1; --ink-3:#8790B3; --line:#2A3358;
  --accent:#8AA2FF; --accent-ink:#0D1226; --accent-soft:#222C57; --mark:#FFD84D; --mark-ink:#2B2200;
  --good:#4FD1A5; --warn:#F0A25A; --bad:#FF7A8A;
  --c-kerja:#8AA2FF; --c-pribadi:#F59E6B; --c-belajar:#4FD1BD;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 28px;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono)}

.app{max-width:960px;margin:0 auto}
.main{min-width:0}

/* top bar */
.topbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--font-display);font-size:23px;letter-spacing:-.02em;line-height:1;border:0;background:transparent;color:var(--ink);padding:5px 12px 5px 5px;margin-left:-5px;border-radius:14px;text-align:left}
.brand:hover{background:var(--surface)}
.brand strong{font-weight:800}
.brand .wm{font-weight:inherit;color:var(--ink)}
.brand .wm span{font-weight:500;color:var(--ink-2)}
.logo{width:36px;height:36px;border-radius:11px;background:var(--accent);display:grid;place-items:center;position:relative;flex:none}
.logo svg{stroke:var(--accent-ink)}
.logo::after{content:"";position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--mark);border:2px solid var(--bg)}
.fpill{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px;font-weight:600;max-width:100%}
.fpill i{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.fpill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fpill button{border:0;background:transparent;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;padding:0;color:var(--ink-2);flex:none}
.fpill button:hover{background:var(--surface)}

/* page header */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px}
.eyebrow{font:500 12px var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.head h1{font-family:var(--font-display);font-weight:800;font-size:44px;line-height:1.02;letter-spacing:-.035em;text-wrap:balance;margin-top:4px}
.sub{color:var(--ink-2);margin-top:6px}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:var(--line)} .ring .fg{stroke:var(--accent);transition:stroke-dashoffset .4s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:500 14px var(--font-mono)}

.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--line);color:var(--ink);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-weight:500}
.banner .btn{background:transparent;border-color:var(--ink-3);color:var(--ink);padding:6px 12px}

/* quick add */
.qa{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto auto;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow)}
.in{width:100%;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.in:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.qa .in{background:var(--surface-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:600;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}

/* sections + rows */
.sec{margin-top:24px}
.sec>h2,.sec>.sec-h{display:flex;align-items:center;gap:8px;font:500 12px var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);border:0;background:none;padding:0}
.sec>h2 em,.sec>.sec-h em{font-style:normal;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 7px;letter-spacing:0}
.sec.late>h2{color:var(--bad)}
.sec-h{cursor:pointer}
.list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.row:hover{border-color:var(--ink-3)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink-3);background:transparent;display:grid;place-items:center;padding:0;color:var(--accent-ink);flex:none}
.chk:hover{border-color:var(--accent)}
.row.done .chk{background:var(--accent);border-color:var(--accent)}
.row-main{border:0;background:transparent;padding:0;text-align:left;display:flex;flex-direction:column;gap:5px;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row.done .t{text-decoration:line-through;color:var(--ink-3);font-weight:500}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;line-height:1.5;padding:1px 9px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.due{font-size:12px;color:var(--ink-2)}
.due.today{background:var(--mark);color:var(--mark-ink);padding:0 7px;border-radius:6px}
.due.late{color:var(--bad);font-weight:500}
.pr{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.pr i{width:3px;border-radius:1px;background:var(--line)}
.pr i:nth-child(1){height:5px}.pr i:nth-child(2){height:8px}.pr i:nth-child(3){height:12px}
.pr.p1 i:nth-child(-n+1){background:var(--ink-3)}
.pr.p2 i:nth-child(-n+2){background:var(--warn)}
.pr.p3 i:nth-child(-n+3){background:var(--bad)}
.empty{margin-top:28px;border:1px dashed var(--ink-3);border-radius:14px;padding:28px 20px;text-align:center;color:var(--ink-2)}
.empty strong{display:block;font-family:var(--font-display);font-size:20px;color:var(--ink);margin-bottom:4px}
.more-note{margin-top:8px;color:var(--ink-3);font-size:13px}

/* board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start;margin-top:20px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:140px;min-width:0}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-family:var(--font-display);font-weight:700;font-size:16px}
.col-h em{font:500 12px var(--font-mono);font-style:normal;color:var(--ink-3)}
.col-h i{width:10px;height:10px;border-radius:50%;background:var(--ink-3)}
.col[data-s="doing"] .col-h i{background:var(--accent)}
.col[data-s="done"] .col-h i{background:var(--good)}
.cards{display:grid;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 11px;display:flex;flex-direction:column;gap:8px;cursor:grab;box-shadow:0 1px 2px rgba(18,26,53,.05)}
.card.done .t{text-decoration:line-through;color:var(--ink-3)}
.card .t{border:0;background:transparent;padding:0;text-align:left;font-weight:600;overflow-wrap:anywhere}
.card-foot{display:flex;justify-content:space-between;gap:6px}
.mv{border:1px solid var(--line);background:transparent;border-radius:8px;width:30px;height:26px;display:grid;place-items:center;color:var(--ink-2);padding:0}
.mv:disabled{opacity:.3;cursor:default}
.col-empty{color:var(--ink-3);font-size:13px;padding:10px 4px}

/* calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:20px}
.cal-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-bar h2{font-family:var(--font-display);font-size:20px;font-weight:700;margin-right:auto}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding:2px 0 4px}
.day{min-height:96px;min-width:0;text-align:left;border:1px solid transparent;background:var(--surface-2);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.day.blank{background:transparent}
.day:not(.blank):hover{border-color:var(--ink-3)}
.day.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.num{font:500 12px var(--font-mono);width:22px;height:22px;display:grid;place-items:center;border-radius:50%;flex:none}
.day.today .num{background:var(--mark);color:var(--mark-ink);font-weight:600}
.ct{font-size:11px;line-height:1.3;padding:2px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);font-weight:600}
.ct.done{text-decoration:line-through;opacity:.6}
.more{font:500 11px var(--font-mono);color:var(--ink-3)}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.dayp{margin-top:20px}
.dayp h2{font-family:var(--font-display);font-size:20px;font-weight:700;margin-bottom:10px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.tile .k{font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tile .v{font-family:var(--font-display);font-weight:800;font-size:36px;letter-spacing:-.03em;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .v small{font:500 13px var(--font-body);letter-spacing:0;color:var(--ink-2);margin-left:4px}
.tile.bad .v{color:var(--bad)}
.panels{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:12px;margin-top:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.panel h2{font-family:var(--font-display);font-size:18px;font-weight:700}
.panel .cap{color:var(--ink-2);font-size:13px;margin:2px 0 10px}
.panel svg{display:block;width:100%;height:auto}
.grid{stroke:var(--line);stroke-width:1}
.ylab,.xlab{fill:var(--ink-3);font:11px var(--font-mono)}
.xlab.on{fill:var(--ink);font-weight:500}
.bar{fill:var(--accent)}
.bar.today{fill:var(--mark);stroke:var(--mark-ink);stroke-width:1}
.bar.zero{fill:var(--line)}
.val{fill:var(--ink);font:600 12px var(--font-body)}
.dist{display:grid;gap:14px;margin-top:12px}
.dist-h{display:flex;justify-content:space-between;gap:8px;font-weight:600;margin-bottom:6px}
.dist-h span{font:400 12px var(--font-mono);color:var(--ink-2)}
.track{display:flex;height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.track b{display:block;height:100%;background:var(--c)}
.track b.dn{background:color-mix(in srgb,var(--c) 35%,var(--surface-2))}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* drawer */
.scrim2{position:fixed;inset:0;background:var(--scrim);z-index:50}
.drawer{position:fixed;z-index:51;top:0;left:0;bottom:0;width:min(86vw,360px);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;overflow-y:auto;overscroll-behavior:contain;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.drawer.in{animation:slidein .22s ease-out}
@keyframes slidein{from{transform:translateX(-100%)}to{transform:none}}
.dr-head{display:flex;align-items:center;gap:6px}
.dr-head .logo{margin-right:8px}
.drbrand{display:flex;align-items:center;border:0;background:transparent;color:var(--ink);padding:4px 10px 4px 4px;margin-left:-4px;border-radius:14px;margin-right:auto}
.drbrand:hover{background:var(--surface-2)}
.dr-name{font-family:var(--font-display);font-size:22px;letter-spacing:-.02em;margin-right:auto;white-space:nowrap}
.dr-name strong{font-weight:800}
.dr-name span{font-weight:500;color:var(--ink-2)}
.x{border:0;background:transparent;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.x:hover{background:var(--surface-2)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--ink-3)}
.search input{border:0;background:transparent;outline:0;padding:11px 0;width:100%;min-width:0;color:var(--ink)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dsec-h{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:var(--surface-2);color:var(--accent);padding:13px 14px;border-radius:12px;font-weight:700;font-size:16px;text-align:left}
.dsec-h svg{transition:transform .15s;flex:none}
.dsec-h[aria-expanded="false"] svg{transform:rotate(180deg)}
.dlist{display:flex;flex-direction:column;gap:2px;padding:6px 0 4px}
.di{display:flex;align-items:center;gap:14px;border:0;background:transparent;padding:12px 14px;border-radius:12px;color:var(--ink);font-weight:500;font-size:16px;text-align:left;width:100%}
.di:hover{background:var(--surface-2)}
.di.on{background:var(--accent-soft);font-weight:700}
.di .ic{color:var(--ic,var(--ink-2));display:grid;place-items:center;width:24px;flex:none}
.di .dot{width:11px;height:11px;border-radius:4px;background:var(--c);margin:0 6px}
.di em{margin-left:auto;font:500 13px var(--font-mono);font-style:normal;color:var(--accent)}
.di.danger{color:var(--bad)}
.di.danger .ic{color:var(--bad)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;min-height:48px}
.setrow>span{font-weight:500}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.sw{width:44px;height:26px;border-radius:999px;border:0;background:var(--line);position:relative;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}

/* edit sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60}
.sheet{position:fixed;z-index:61;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;padding:20px max(20px,env(safe-area-inset-right,0px)) 20px 20px;overflow-y:auto}
.sheet header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sheet h2{font-family:var(--font-display);font-size:22px;font-weight:700}
.sheet form{display:grid;gap:14px}
.sheet label{display:grid;gap:5px;font:500 12px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.sheet label .in{font:400 15px var(--font-body);letter-spacing:0;text-transform:none;color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sheet footer{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.sp{flex:1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1}

.sgrp{display:grid;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.sgrp h3{font:500 12px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.sgrp .seg{display:flex}.sgrp .seg button{flex:1}
.prof{display:flex;gap:14px;align-items:flex-start}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 22px var(--font-display);flex:none}
.pf{display:grid;gap:10px;flex:1;min-width:0}
.pf label{display:grid;gap:4px;font:500 12px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.infot{margin:0 14px 8px;padding:10px 12px;background:var(--surface-2);border-radius:10px;color:var(--ink-2);font-size:14px;line-height:1.5}

<script>
(function(){
'use strict';

/* ---------- constants & helpers ---------- */
const APP_VER='26.01';
const TAGS=['Kerja','Pribadi','Belajar'];

const DAYS=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const DAY3=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const MONTHS=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const MON3=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
/* calendar words per language: id, ms, en */
const CALW={
  id:{p:['','Rendah','Sedang','Tinggi'],s:['Rencana','Dikerjakan','Selesai'],d:['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],d3:['Min','Sen','Sel','Rab','Kam','Jum','Sab'],m:['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'],m3:['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des']},
  ms:{p:['','Rendah','Sederhana','Tinggi'],s:['Rancangan','Sedang dibuat','Selesai'],d:['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'],d3:['Ahd','Isn','Sel','Rab','Kha','Jum','Sab'],m:['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'],m3:['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis']},
  en:{p:['','Low','Medium','High'],s:['To do','In progress','Done'],d:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],d3:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],m:['January','February','March','April','May','June','July','August','September','October','November','December'],m3:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']}
};
function setLangWords(lg){
  const w=CALW[lg]||CALW.id;
  PRIO.splice(0,4,...w.p);STAT.todo=w.s[0];STAT.doing=w.s[1];STAT.done=w.s[2];
  DAYS.splice(0,7,...w.d);DAY3.splice(0,7,...w.d3);MONTHS.splice(0,12,...w.m);MON3.splice(0,12,...w.m3);
  try{document.documentElement.lang=lg==='ms'?'ms':lg==='en'?'en':'id'}catch(e){}
}
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TODAY=fmt(new Date());
const uid=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function dueLabel(s){
  if(!s) return L('noDate');
  if(s===TODAY) return L('today');
  if(s===addDays(TODAY,1)) return L('tomorrow');
  if(s===addDays(TODAY,-1)) return L('yesterday');
  const d=parse(s); return d.getDate()+' '+MON3[d.getMonth()];
}
const cmp=(a,b)=>{const x=a.due||'9999',y=b.due||'9999';return x<y?-1:x>y?1:(b.prio-a.prio)||a.title.localeCompare(b.title,'id')};

/* ---------- icons ---------- */
const P={
  list:'<path d="M8 6h12M8 12h12M8 18h12"/><path d="M3.5 6l1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/>',

  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',

  r:'<path d="M9 5l7 7-7 7"/>',
  burger:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  user:'<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.9-3.6 3.8-5.5 7.5-5.5s6.6 1.9 7.5 5.5"/>',
  gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/>',

};
const logo=sz=>'<svg class="lg" width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="animation-delay:-'+(Date.now()%6000)+'ms"><path class="lg-ck" d="M5 12.5l4.5 4.5L19 7.5"/><path class="lg-sp" stroke="none" d="M19 2l.9 2.1L22 5l-2.1.9L19 8l-.9-2.1L16 5l2.1-.9z"/></svg>';

/* ---------- sample data (shown until the first change) ---------- */
function demoTasks(){
  const d=n=>addDays(TODAY,n);
  const T=(i,title,tag,due,prio,status,doneAt,note)=>({id:'d'+i,title:title,note:note||'',tag:tag,due:due,prio:prio,status:status,createdAt:d(-7),doneAt:doneAt||''});
  const SP={1:'d',5:'d',2:'d',3:'w',4:'w',8:'w',6:'m',7:'m',16:'y',9:'d',11:'w',14:'w'};
  return [
    T(1,'Kirim proposal ke klien','Kerja',d(0),3,'doing','','Lampirkan ringkasan anggaran dan jadwal kerja.'),
    T(2,'Balas email tim desain','Kerja',d(-1),2,'todo'),
    T(3,'Siapkan bahan rapat mingguan','Kerja',d(2),2,'todo'),
    T(4,'Rapikan folder dokumen proyek','Kerja','',1,'todo'),
    T(5,'Beli bahan masak untuk akhir pekan','Pribadi',d(0),1,'todo'),
    T(6,'Bayar tagihan internet','Pribadi',d(1),3,'todo'),
    T(7,'Telepon orang tua','Pribadi',d(4),2,'todo'),
    T(8,'Baca bab 4 buku statistik','Belajar',d(1),2,'doing'),
    T(9,'Latihan 20 soal bahasa Inggris','Belajar',d(0),2,'done',d(0)),
    T(10,'Cuci mobil','Pribadi',d(-1),1,'done',d(-1)),
    T(11,'Revisi slide presentasi','Kerja',d(-2),3,'done',d(-2)),
    T(12,'Olahraga pagi 30 menit','Pribadi',d(-3),1,'done',d(-3)),
    T(13,'Kirim laporan pengeluaran','Kerja',d(-3),2,'done',d(-3)),
    T(14,'Rangkum materi kuliah minggu ini','Belajar',d(-5),2,'done',d(-5)),
    T(15,'Servis laptop','Pribadi',d(-6),2,'done',d(-6)),
    T(16,'Pesan tiket kereta','Pribadi',d(9),2,'todo')
  ].map(function(t){const k=SP[t.id.slice(1)];if(!k) return t;t.span=k;if(t.id!=='d2') t.createdAt=periodStart(k);return t});
}
function norm(v){
  const t=v||{};
  return {
    id:String(t.id||uid()),
    title:String(t.title||'Tanpa judul').slice(0,200),
    note:String(t.note||'').slice(0,2000),
    tag:TAGS.indexOf(t.tag)>=0?t.tag:'Pribadi',
    due:/^\d{4}-\d{2}-\d{2}$/.test(t.due||'')?t.due:'',
    prio:[1,2,3].indexOf(+t.prio)>=0?+t.prio:2,
    status:ORDER.indexOf(t.status)>=0?t.status:'todo',
    span:['d','w','m','y'].indexOf(t.span)>=0?t.span:'',
    createdAt:/^\d{4}-\d{2}-\d{2}$/.test(t.createdAt||'')?t.createdAt:TODAY,
    doneAt:/^\d{4}-\d{2}-\d{2}$/.test(t.doneAt||'')?t.doneAt:''
  };
}

/* ---------- state ---------- */
const S={tasks:[],demo:false,view:'today',tag:'all',q:'',showDone:true,calMonth:TODAY.slice(0,7),calSel:TODAY,sheet:null,
  menu:false,menuFresh:false,open:{views:true,tags:true,settings:false},theme:'auto',lang:'id',panel:null,info:null,gi:0,goals:{w:15,m:60,y:600},profile:{name:'',nick:'',user:'',email:'',phone:'',birth:'',gender:'',city:'',job:'',org:'',bio:'',goal:5,remind:'',photo:'',since:''},
  qa:{title:'',tag:'Kerja',prio:2,due:null,span:''},gk:'d',gTitle:'',gDue:'',side:true,user:null,auth:{mode:'login',email:'',err:'',fails:0,lock:0}};

/* ---------- theme preference (per viewer) ---------- */
let themeSet=false;
function applyTheme(p){
  const r=document.documentElement;
  if(p==='light'||p==='dark'){r.setAttribute('data-theme',p);themeSet=true}
  else if(themeSet){r.removeAttribute('data-theme');themeSet=false}
  applyLook();
}

/* ---------- storage: private db per person, browser storage as fallback ---------- */
const LS='zui-todo:v1';
const store={
  mode:'local',db:null,uid:null,queue:Promise.resolve(),
  lsLoad(){try{const r=localStorage.getItem(K('v1'));return r?JSON.parse(r):null}catch(e){return null}},
  lsSave(){try{localStorage.setItem(K('v1'),JSON.stringify({tasks:S.tasks,onboarded:true}))}catch(e){}},
  enqueue(fn){
    store.queue=store.queue.then(fn).catch(function(e){console.warn('zui save',e);toast(e&&e.code==='permission-denied'?L('roMsg'):L('notSaved'))});
    return store.queue;
  },
  col(){return store.db.collection('users/'+store.uid+'/tasks')},
  put(t){
    if(store.mode==='db'){const ref=store.col().doc(t.id);store.enqueue(function(){return ref.set(t)})}
    else store.lsSave();
  },
  del(id){
    if(store.mode==='db'){const ref=store.col().doc(id);store.enqueue(function(){return ref.delete()})}
    else store.lsSave();
  },
  meta(){
    if(store.mode==='db'){const ref=store.col().doc('_meta');store.enqueue(function(){return ref.set({onboarded:true})})}
    else store.lsSave();
  }
};
function ensureReal(){
  if(!S.demo) return;
  S.demo=false;
  if(store.mode==='db'){S.tasks.forEach(function(t){store.put(t)});store.meta()}
}
function upsert(t){
  if(!canWrite()) return;
  ensureReal();
  const i=S.tasks.findIndex(function(x){return x.id===t.id});
  if(i>=0) S.tasks[i]=t; else S.tasks.push(t);
  store.put(t); render();
}
function removeTask(id){
  if(!canWrite()) return;
  ensureReal();
  S.tasks=S.tasks.filter(function(t){return t.id!==id});
  store.del(id); render();
}
function clearDemo(){
  S.demo=false;S.tasks=[];store.meta();render();
}
function clearDone(){
  const gone=S.tasks.filter(function(t){return t.status==='done'});
  if(!gone.length){toast(L('noDoneYet'));return}
  if(!canWrite()) return;
  ensureReal();
  S.tasks=S.tasks.filter(function(t){return t.status!=='done'});
  gone.forEach(function(t){store.del(t.id)});
  render();toast(gone.length+' '+L('doneDeleted'));
}
function setStatus(id,status){
  const t=S.tasks.find(function(x){return x.id===id}); if(!t||t.status===status) return;
  upsert(Object.assign({},t,{status:status,doneAt:status==='done'?(t.doneAt||TODAY):''}));
}
function toggle(id){
  const t=S.tasks.find(function(x){return x.id===id}); if(!t) return;
  setStatus(id,t.status==='done'?'todo':'done');
}
function move(id,dir){
  const t=S.tasks.find(function(x){return x.id===id}); if(!t) return;
  const n=ORDER.indexOf(t.status)+dir; if(n<0||n>2) return;
  setStatus(id,ORDER[n]);
}

async function initStore(){
  const c=window.claude; if(!c||!c.use) return;
  try{
    const res=await Promise.all([c.use('db'),c.use('user')]);
    const db=res[0],user=res[1]; if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    store.db=db;store.uid=id;store.mode='db';
    store.col().onSnapshot(function(snap){
      let onboarded=false;const list=[];
      snap.docs.forEach(function(d){
        if(d.id==='_meta'){onboarded=d.exists;return}
        const v=d.data(); if(v&&v.id) list.push(norm(v));
      });
      if(!onboarded&&list.length===0){S.demo=true;S.tasks=demoTasks()}
      else{S.demo=false;S.tasks=list}
      render();
    },function(err){
      console.warn('zui db',err);store.mode='local';
    });
  }catch(e){console.warn('zui init',e)}
}

/* ---------- derived ---------- */
function visible(){
  const q=S.q.trim().toLowerCase();
  return S.tasks.filter(function(t){
    if(S.tag!=='all'&&t.tag!==S.tag) return false;
    if(q&&(t.title+' '+t.note).toLowerCase().indexOf(q)<0) return false;
    return true;

}

/* ---------- views ---------- */
function viewToday(){
  const vis=visible(),open=vis.filter(function(t){return t.status!=='done'});
  const late=open.filter(function(t){return t.due&&t.due<TODAY}).sort(cmp);
  const today=open.filter(function(t){return t.due===TODAY}).sort(cmp);
  const next=open.filter(function(t){return t.due>TODAY}).sort(cmp);
  const none=open.filter(function(t){return !t.due}).sort(cmp);
  const done=vis.filter(function(t){return t.status==='done'}).sort(function(a,b){return a.doneAt<b.doneAt?1:a.doneAt>b.doneAt?-1:0});
  const doneToday=done.filter(function(t){return t.doneAt===TODAY}).length;
  const planned=today.length+late.length+doneToday;
  const pct=planned?doneToday/planned:0;
  const C=2*Math.PI*30;
  const d=parse(TODAY);
  const waiting=today.length+late.length;
  const sub=waiting?(waiting+' '+L('nWaiting')+(late.length?', '+late.length+' '+L('nLate'):'')):(planned?L('allDoneToday'):L('noTaskToday'));
  let h='<header class="head"><div><p class="eyebrow">'+DAYS[d.getDay()]+'</p><h1>'+d.getDate()+' '+MONTHS[d.getMonth()]+'</h1><p class="sub">'+sub+'</p></div>'
    +'<div class="ring" role="img" aria-label="'+doneToday+' / '+planned+'"><svg viewBox="0 0 76 76"><circle class="tr" cx="38" cy="38" r="30" fill="none" stroke-width="7"/><circle class="fg" cx="38" cy="38" r="30" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-pct)).toFixed(1)+'"/></svg><b>'+doneToday+'/'+planned+'</b></div></header>';
  h+=banner()+qaForm(TODAY);
  if(!vis.length){
    h+='<div class="empty"><strong>'+L('emptyT')+'</strong>'+L('emptyS')+'</div>';
    return h;
  }
  h+=section(L('sLate'),late,'late')+section(L('today'),today)+section(L('upcoming'),next)+section(L('noDate'),none);
  if(done.length&&S.showDone){
    h+='<section class="sec"><h2>'+L('sDone')+' <em>'+done.length+'</em></h2><ul class="list">'+done.slice(0,6).map(row).join('')+'</ul>';
    if(done.length>6) h+='<p class="more-note">'+L('show6').replace('{n}',done.length)+'</p>';
    h+='</section>';
  }
  return h;
}

function viewCal(){
  const p=S.calMonth.split('-').map(Number),y=p[0],m=p[1];
  const first=new Date(y,m-1,1),nd=new Date(y,m,0).getDate(),off=(first.getDay()+6)%7,rows=Math.ceil((off+nd)/7);
  const vis=visible(),by={};
  vis.forEach(function(t){if(t.due)(by[t.due]=by[t.due]||[]).push(t)});
  let h='<header class="head"><div><p class="eyebrow">'+L('vCal')+'</p><h1>'+MONTHS[m-1]+' '+y+'</h1></div></header>'+banner();
  h+='<div class="cal"><div class="cal-bar"><h2>'+L('byDue')+'</h2>'
    +'<button class="btn sm" type="button" data-act="cal-today">'+L('today')+'</button>'

  for(let i=0;i<rows*7;i++){

    h+='<button class="day'+(ds===TODAY?' today':'')+(ds===S.calSel?' sel':'')+'" type="button" data-act="day" data-d="'+ds+'" aria-label="'+day+' '+MONTHS[m-1]+', '+list.length+' '+L('gTasks')+'"><span class="num">'+day+'</span>'

      +(list.length>2?'<span class="more">+'+(list.length-2)+' '+L('more2')+'</span>':'')
      +(list.length?'<span class="dots">'+list.slice(0,4).map(function(t){return '<i style="--c:'+TAGC[t.tag]+'"></i>'}).join('')+'</span>':'')+'</button>';
  }
  h+='</div></div>';
  const sd=parse(S.calSel),sl=(by[S.calSel]||[]).slice().sort(function(a,b){return (a.status==='done')-(b.status==='done')||cmp(a,b)});
  h+='<section class="dayp"><h2>'+DAYS[sd.getDay()]+', '+sd.getDate()+' '+MONTHS[sd.getMonth()]+'</h2>'+qaForm(S.calSel)

  return h;

function chartSvg(days){
  const W=420,H=230,L=30,R=6,T=20,B=34,iw=W-L-R,ih=H-T-B;
  const mx=Math.max(4,2*Math.ceil(Math.max.apply(null,days.map(function(x){return x.n}))/2));
  const bw=iw/days.length,bar=bw*0.56;
  let g='';
  [0,mx/2,mx].forEach(function(v){
    const y=T+ih-ih*v/mx;
    g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="ylab" x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+v+'</text>';
  });
  days.forEach(function(x,i){
    const h=ih*x.n/mx,cx=L+bw*i+bw/2,y=T+ih-h;
    g+=x.n
      ?'<rect class="bar'+(x.today?' today':'')+'" x="'+(cx-bar/2)+'" y="'+y+'" width="'+bar+'" height="'+h+'" rx="4"/><text class="val" x="'+cx+'" y="'+(y-5)+'" text-anchor="middle">'+x.n+'</text>'
      :'<rect class="bar zero" x="'+(cx-bar/2)+'" y="'+(T+ih-2)+'" width="'+bar+'" height="2" rx="1"/>';
    g+='<text class="xlab'+(x.today?' on':'')+'" x="'+cx+'" y="'+(H-12)+'" text-anchor="middle">'+x.label+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+L('perDay')+'">'+g+'</svg>';
}
function viewStats(){
  const vis=visible();
  const days=[];
  for(let i=6;i>=0;i--){
    const ds=addDays(TODAY,-i);
    days.push({d:ds,label:DAY3[parse(ds).getDay()],today:i===0,n:vis.filter(function(t){return t.status==='done'&&t.doneAt===ds}).length});
  }
  const week=days.reduce(function(a,x){return a+x.n},0);
  const open=vis.filter(function(t){return t.status!=='done'}).length;
  const late=vis.filter(function(t){return t.status!=='done'&&t.due&&t.due<TODAY}).length;
  let streak=0,cur=TODAY;
  const doneOn=function(ds){return vis.some(function(t){return t.status==='done'&&t.doneAt===ds})};
  if(!doneOn(cur)) cur=addDays(cur,-1);
  while(doneOn(cur)&&streak<365){streak++;cur=addDays(cur,-1)}
  let h='<header class="head"><div><p class="eyebrow">'+L('vStats')+'</p><h1>'+L('thisWeek')+'</h1><p class="sub">'+(week?week+' '+L('week7'):L('week7none'))+'</p></div></header>'+banner();
  h+='<div class="tiles">'
    +'<div class="tile"><p class="k">'+L('sDone')+'</p><p class="v">'+week+'<small>/ 7 '+L('days')+'</small></p></div>'
    +'<div class="tile"><p class="k">'+L('remain')+'</p><p class="v">'+open+'<small>'+L('gTasks')+'</small></p></div>'
    +'<div class="tile'+(late?' bad':'')+'"><p class="k">'+L('sLate')+'</p><p class="v">'+late+'<small>'+L('gTasks')+'</small></p></div>'
    +'<div class="tile"><p class="k">'+L('streak')+'</p><p class="v">'+streak+'<small>'+L('days')+'</small></p></div></div>';
  h+='<div class="panels"><section class="panel"><h2>'+L('perDayT')+'</h2><p class="cap">'+L('todayYellow')+'</p>'+chartSvg(days)+'</section>';
  const mxT=Math.max(1,Math.max.apply(null,TAGS.map(function(g){return vis.filter(function(t){return t.tag===g}).length})));
  h+='<section class="panel"><h2>'+L('perCat')+'</h2><p class="cap">'+L('perCatS')+'</p><div class="dist">';
  TAGS.forEach(function(g){
    const o=vis.filter(function(t){return t.tag===g&&t.status!=='done'}).length,d=vis.filter(function(t){return t.tag===g&&t.status==='done'}).length;
    h+='<div style="--c:'+TAGC[g]+'"><div class="dist-h">'+esc(g)+'<span>'+o+' '+L('sOpen').toLowerCase()+' · '+d+' '+L('sDone').toLowerCase()+'</span></div><div class="track" style="width:'+Math.max(6,(o+d)/mxT*100)+'%">'
      +(o?'<b style="flex:'+o+'"></b>':'')+(d?'<b class="dn" style="flex:'+d+'"></b>':'')+'</div></div>';
  });
  h+='</div><div class="legend"><span><i style="background:var(--ink-2)"></i>'+L('sOpen')+'</span><span><i style="background:color-mix(in srgb,var(--ink-2) 35%,var(--surface-2))"></i>'+L('sDone')+'</span></div></section></div>';
  return h;
}

function render(){
  if(!S.user){if(!authRoot.firstChild) renderAuth();return}
  const wide=isWide();document.body.classList.toggle('wide',wide);document.body.classList.toggle('nosb',wide&&!S.side);
  const a=document.activeElement;
  const inUi=a&&a.id&&(app.contains(a)||drawerRoot.contains(a));
  const keep=inUi?{id:a.id,s:a.selectionStart,e:a.selectionEnd}:null;
  const old=drawerRoot.querySelector('.drawer'),st=old?old.scrollTop:0;
  const v=S.view==='board'?viewBoard():S.view==='cal'?viewCal():S.view==='stats'?viewStats():viewToday();
  app.innerHTML=topbar()+'<main class="main">'+v+'</main>';

  }
}

async function hashPw(pw,salt){
  try{
    const enc=new TextEncoder(),key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:120000,hash:'SHA-256'},key,256);

const SPANS=['d','w','m','y'];

function periodStart(k){
  if(k==='d') return TODAY;
  if(k==='w') return addDays(TODAY,-((parse(TODAY).getDay()+6)%7));
  if(k==='m') return TODAY.slice(0,8)+'01';
  return TODAY.slice(0,4)+'-01-01';
}
function periodEnd(k){
  if(k==='d') return TODAY;
  if(k==='w') return addDays(periodStart('w'),6);
  const d=parse(TODAY);
  return fmt(k==='m'?new Date(d.getFullYear(),d.getMonth()+1,0):new Date(d.getFullYear(),11,31));
}
function isCarried(t){
  if(!t.span||t.status==='done') return false;
  const st=periodStart(t.span);
  return t.createdAt<st||(!!t.due&&t.due<st);
}
function spanOpen(k){
  const e=periodEnd(k);
  return S.tasks.filter(function(t){return t.span===k&&t.status!=='done'&&(!t.due||t.due<=e)}).sort(function(a,b){return (isCarried(b)-isCarried(a))||cmp(a,b)});
}
function spanDone(k){
  const a=periodStart(k),b=periodEnd(k);
  return S.tasks.filter(function(t){return t.span===k&&t.status==='done'&&t.doneAt>=a&&t.doneAt<=b}).sort(function(x,y){return x.doneAt<y.doneAt?1:-1});
}
function goalData(){
  const done=S.tasks.filter(function(t){return t.status==='done'&&t.doneAt});
  const cnt=function(f){return done.filter(function(t){return f(t.doneAt)}).length};
  const ws=periodStart('w'),we=periodEnd('w'),d=parse(TODAY),a=parse(ws),b=parse(we);
  const base=[
    {k:'d',sub:DAYS[d.getDay()]+', '+d.getDate()+' '+MON3[d.getMonth()],n:cnt(function(x){return x===TODAY}),goal:Math.max(1,+S.profile.goal||5)},
    {k:'w',sub:a.getDate()+' '+MON3[a.getMonth()]+' – '+b.getDate()+' '+MON3[b.getMonth()],n:cnt(function(x){return x>=ws&&x<=we}),goal:S.goals.w},
    {k:'m',sub:MONTHS[d.getMonth()]+' '+d.getFullYear(),n:cnt(function(x){return x.slice(0,7)===TODAY.slice(0,7)}),goal:S.goals.m},
    {k:'y',sub:String(d.getFullYear()),n:cnt(function(x){return x.slice(0,4)===TODAY.slice(0,4)}),goal:S.goals.y}
  ];
  return base.map(function(x){
    const op=spanOpen(x.k),dn=spanDone(x.k);
    x.t=spanName(x.k);x.open=op;x.sdone=dn.length;x.total=op.length+dn.length;
    x.carried=op.filter(isCarried).length;
    x.late=op.filter(function(t){return t.due&&t.due<TODAY}).length;
    return x;
  });
}

   +(!op.length&&!dn.length?'<p class="muted center">'+L('emptySpan')+'</p>':'');

function goalStep(k,dir){
  const step={d:1,w:1,m:5,y:50}[k];
  if(k==='d'){S.profile.goal=Math.max(1,Math.min(999,(+S.profile.goal||5)+dir*step));saveProfile()}
  else{S.goals[k]=Math.max(1,Math.min(99999,S.goals[k]+dir*step));saveGoals()}
  render();
}
function restoreGoalScroll(){const g=document.querySelector('.gslides'); if(g) g.scrollLeft=S.gi*g.clientWidth}
document.addEventListener('scroll',function(e){
  const g=e.target; if(!g.classList||!g.classList.contains('gslides')) return;

  if(i!==S.gi){S.gi=i;document.querySelectorAll('.gdots button').forEach(function(b,j){b.classList.toggle('on',j===i)})}
},true);

function hexOf(c){
  if(/^#[0-9a-f]{6}$/i.test(c)) return c;
  const m=/var\((--[\w-]+)\)/.exec(c||''); if(!m) return '#2A4FEE';
  let v=getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim();
  return /^#[0-9a-f]{6}$/i.test(v)?v:'#2A4FEE';
}

  if(!el.dataset.armed){el.dataset.armed='1';el.classList.add('arm');toast(L('catDelHint'));setTimeout(function(){if(el.isConnected){delete el.dataset.armed;el.classList.remove('arm')}},3000);return}

function catRename(inp){
  const i=+inp.dataset.i,old=TAGS[i],n=inp.value.trim().slice(0,20);
  if(!n||n===old){inp.value=old;return}
  if(!canWrite()){inp.value=old;return}
  if(TAGS.some(function(x,j){return j!==i&&x.toLowerCase()===n.toLowerCase()})){toast(L('catDup'));inp.value=old;return}
  TAGS[i]=n;TAGC[n]=TAGC[old];delete TAGC[old];
  ensureReal();
  S.tasks.forEach(function(t,k){if(t.tag===old){S.tasks[k]=Object.assign({},t,{tag:n});store.put(S.tasks[k])}});
  if(S.tag===old) S.tag=n; if(S.qa.tag===old) S.qa.tag=n;
  saveTags();render();
}

function profStats(){
  const done=S.tasks.filter(function(t){return t.status==='done'}),open=S.tasks.filter(function(t){return t.status!=='done'});
  const late=open.filter(function(t){return t.due&&t.due<TODAY}).length;
  const days={};done.forEach(function(t){if(t.doneAt) days[t.doneAt]=(days[t.doneAt]||0)+1});
  let d=TODAY,streak=0; if(!days[d]) d=addDays(TODAY,-1);
  while(days[d]){streak++;d=addDays(d,-1)}
  const rate=S.tasks.length?Math.round(done.length/S.tasks.length*100):0;
  return {done:done.length,open:open.length,late:late,streak:streak,rate:rate,today:days[TODAY]||0};
}

  else if(t.id==='chat-in'){SUB.draft=t.value;t.style.height='auto';t.style.height=Math.min(140,t.scrollHeight)+'px'}
  else if(t.dataset&&t.dataset.look&&feat('look')){toCustom();S.look[t.dataset.look]=t.value;applyLook()}
});
document.addEventListener('change',function(e){
  const t=e.target;
  if(t.dataset&&t.dataset.look){if(!feat('look')) return;toCustom();S.look[t.dataset.look]=t.value;applyLook();saveLook();render();renderPanel()}
  else if(t.id==='chat-img'&&t.files&&t.files[0]){shrinkImg(t.files[0],1000,380000).then(function(d){SUB.img=d;renderChatAttach()}).catch(function(){toast(L('photoBig'))});t.value=''}
  else if(t.id==='restore-f'&&t.files&&t.files[0]){restoreJson(t.files[0]);t.value=''}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.target.id==='chat-in'){e.preventDefault();chatSend()}});
document.addEventListener('input',function(e){const t=e.target;if(t.id==='g-title') S.gTitle=t.value; else if(t.id==='g-due') S.gDue=t.value; else if(t.id==='au-pw'||t.id==='au-pw2') updateRules()});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&/^au-(email|pw|pw2)$/.test(e.target.id||'')){e.preventDefault();authSubmit();return}
  if(e.key==='Enter'&&e.target.id==='g-title'){e.preventDefault();goalAdd();return}
  if(e.key==='Enter'&&e.target.id==='cat-new'){e.preventDefault();catAdd()}
  else if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.cat==='name'){e.target.blur()}
});

   ['Apa itu Zui To-Do?','Zui To-Do adalah aplikasi daftar tugas dari Zui System untuk mencatat tugas, mengatur prioritas, dan memantau target harian, mingguan, bulanan, sampai tahunan.'],
   ['Bagaimana cara membuka menu?','Ketuk logo Zui To-Do di kiri atas. Di layar lebar menu selalu tampil di sisi kiri dan bisa disembunyikan dengan mengetuk logo.'],
   ['Apakah data saya tersimpan di semua perangkat?','Ya. Tugas, kategori, profil, dan tema tersimpan di akunmu dan otomatis tersinkron saat kamu masuk dengan akun yang sama di perangkat lain.'],
   ['Apa arti tugas "Lanjutan"?','Tugas berjangka (harian, mingguan, bulanan, tahunan) yang belum selesai otomatis ikut ke periode berikutnya dan diberi tanda Lanjutan, jadi tidak ada yang hilang.'],
   ['Berapa lama masa percobaan?','14 hari dengan semua fitur paket Bisnis. Setelah itu ada masa tenggang 3 hari. Bila belum berlangganan, data tetap aman tetapi hanya bisa dibaca.'],
   ['Bagaimana cara berlangganan?','Buka Pengaturan → Kelola langganan, pilih paket dan durasi, bayar lewat QRIS (Rupiah) atau DuitNow (Ringgit), lalu kirim nomor referensinya. Admin Zui mengaktifkan paket setelah pembayaran diterima, biasanya maksimal 1×24 jam.'],

  terms:[
   ['','Syarat ini mengatur penggunaan aplikasi Zui To-Do (“layanan”) yang dikelola oleh Zui System, PT. Zaor Utama Indonesia (“kami”). Dengan membuat akun atau memakai layanan, kamu menyetujui syarat ini.'],
   ['1. Layanan kami',['Zui To-Do adalah aplikasi web untuk mencatat dan mengatur tugas pribadi, yang tersimpan di akunmu dan tersinkron di semua perangkat tempat kamu masuk:','- Tugas: judul, catatan, prioritas, kategori, tenggat, dan tugas berjangka (harian, mingguan, bulanan, tahunan). Tugas berjangka yang belum selesai otomatis ikut ke periode berikutnya sebagai tugas Lanjutan.','- Tampilan: Hari ini, Papan, Kalender, dan Ringkasan.','- Target: target tugas harian, mingguan, bulanan, dan tahunan.','- Profil dan tema: profil pribadi, tema siap pakai, dan racik tema sendiri (paket tertentu).','- Data: ekspor tugas ke CSV, serta cadangkan dan pulihkan data (JSON) sesuai paket.','- Bantuan: chat dengan admin Zui dan permintaan langganan.','Kami bisa menambah, mengubah, atau menghentikan fitur dari waktu ke waktu.']],
   ['2. Akun dan keamanan',['- Kamu harus berusia minimal 18 tahun, atau mendapat persetujuan orang tua atau wali bila di bawah 18 tahun.','- Kamu wajib memberi nama dan email yang benar agar akunmu bisa dipulihkan.','- Satu akun untuk satu pengguna. Jangan berbagi akun dengan orang lain.','- Jaga kerahasiaan kata sandi. Semua kegiatan di akunmu menjadi tanggung jawabmu.','- Segera hubungi kami bila kamu menduga akunmu dipakai orang lain.']],
   ['3. Paket dan fitur',['Setiap akun memakai salah satu paket berikut:','- Starter: semua tampilan (Hari ini, Papan, Kalender, Ringkasan), target harian sampai tahunan, sinkron di semua perangkat, 8 tema siap pakai, dan hingga 5 kategori.','- Pro: semua fitur Starter, kategori hingga 50, racik tema sendiri (warna, huruf, ukuran teks, sudut), dan ekspor tugas ke CSV.','- Bisnis: semua fitur Pro, cadangkan dan pulihkan data (JSON), dan prioritas balasan chat admin.','Bila kamu pindah ke paket yang lebih rendah, fitur yang tidak termasuk di paket itu terkunci, tetapi data yang sudah ada tetap tersimpan.']],
   ['4. Masa percobaan dan langganan',['- Akun baru mendapat masa percobaan gratis selama 14 hari dengan semua fitur paket Bisnis.','- Setelah masa percobaan, kamu bisa memilih paket Starter, Pro, atau Bisnis dengan durasi 1 bulan, 6 bulan, atau 1 tahun. Harga berlaku per akun dan ditampilkan di Pengaturan → Kelola langganan dalam Rupiah atau Ringgit.','- Harga bisa berubah. Perubahan harga tidak memengaruhi masa langganan yang sudah dibayar.','- Pembayaran dilakukan lewat QRIS (Rupiah) atau DuitNow (Ringgit) ke kode yang tertera di Kelola langganan. Setelah membayar, tulis nomor referensi dari bukti bayar lalu kirim lewat menu tersebut. Kamu juga bisa mengirim foto bukti bayar lewat chat admin.','- Kami memeriksa pembayaran lalu mengaktifkan langganan secara manual, biasanya paling lambat 1 × 24 jam. Waktu aktivasi bergantung pada jam layanan dan tidak dijamin seketika. Masa aktif ditambahkan dari tanggal berakhir yang sekarang, atau dari hari aktivasi bila masa aktif sudah lewat.','- Langganan tidak diperpanjang otomatis.','- Jika masa percobaan atau langganan habis, ada masa tenggang 3 hari. Setelah itu tugas dan data hanya bisa dibaca dan tidak bisa diubah sampai langganan aktif. Data tetap tersimpan.','- Langganan yang sudah aktif tidak dapat dibatalkan dan pembayarannya tidak dapat dikembalikan, kecuali karena kesalahan pembayaran sesuai Kebijakan Pengembalian Dana.']],
   ['5. Data milikmu','Data yang kamu masukkan, seperti tugas, kategori, target, dan profil, tetap milikmu. Kami hanya memakainya untuk menjalankan layanan sesuai Kebijakan Privasi. Kamu bertanggung jawab atas isi yang kamu catat dan memastikan kamu berhak menyimpannya, termasuk bila tugasmu memuat data orang lain. Kami menyarankan kamu mencadangkan data secara berkala.'],
   ['6. Penggunaan yang dilarang',['- Memakai layanan untuk menyimpan atau menyebarkan konten yang melanggar hukum, atau memasukkan data pihak lain tanpa hak.','- Mencoba membuka data pengguna lain, membobol keamanan, atau mengganggu kerja layanan.','- Mengirim nomor referensi atau bukti bayar yang dipalsukan, diubah, atau dipakai ulang.','- Menyalin, menjual kembali, atau menyewakan akses layanan tanpa izin tertulis dari kami.']],
   ['7. Ketersediaan layanan','Kami berusaha agar layanan selalu bisa dipakai, tetapi tidak menjamin layanan bebas gangguan. Pemeliharaan, pembaruan, gangguan jaringan, atau gangguan penyedia infrastruktur bisa membuat layanan atau sinkronisasi sementara tidak tersedia.'],
   ['8. Batas tanggung jawab','Zui To-Do adalah alat bantu pencatatan. Pengingat, target, dan ringkasan di layanan dihitung dari data yang kamu masukkan. Sejauh diizinkan hukum, kami tidak bertanggung jawab atas kerugian tidak langsung, kehilangan keuntungan, tugas atau tenggat yang terlewat, atau kerugian akibat data yang salah. Total tanggung jawab kami atas satu perselisihan tidak melebihi jumlah yang kamu bayarkan untuk langganan selama 3 bulan terakhir.'],
   ['9. Penghentian','Kamu bisa berhenti memakai layanan kapan saja dengan tidak memperpanjang langganan, menghapus tugas dan data profil di aplikasi, atau meminta penghapusan akun dan seluruh datanya lewat '+SUPPORT+'. Kami bisa menangguhkan atau menutup akun yang melanggar syarat ini, dengan pemberitahuan bila memungkinkan.'],
   ['10. Perubahan syarat','Kami bisa memperbarui syarat ini. Perubahan penting akan kami umumkan di layanan atau lewat email. Tanggal berlaku di atas menunjukkan versi terbaru.'],
   ['11. Hukum yang berlaku','Syarat ini tunduk pada hukum Republik Indonesia. Perselisihan diselesaikan lebih dulu secara musyawarah, dan bila tidak tercapai, melalui Pengadilan Negeri Pamekasan.'],

  privacy:[
   ['','Kebijakan ini menjelaskan data apa yang dikumpulkan Zui To-Do, untuk apa, dan bagaimana kamu bisa mengaturnya. Kami mengikuti Undang-Undang Nomor 27 Tahun 2022 tentang Pelindungan Data Pribadi.'],
   ['1. Data yang kami kumpulkan',['- Data akun: nama, email, dan kata sandi. Kata sandi dikelola oleh Firebase Authentication dan tidak bisa kami lihat. Bila kamu masuk dengan Google, kami menerima nama dan email akun Google-mu.','- Profil (opsional): nama lengkap, nama panggilan, username, tanggal lahir, jenis kelamin, telepon, kota atau negara, pekerjaan, instansi atau sekolah, bio, foto profil, target tugas per hari, dan jam pengingat. Semua bidang ini boleh dikosongkan.','- Data yang kamu masukkan: tugas beserta catatan, prioritas, tenggat, dan statusnya, kategori, serta target.','- Pengaturan: bahasa, tema, dan racikan tema yang tersimpan di akunmu.','- Langganan dan bantuan: paket, durasi, jumlah, mata uang, dan nomor referensi pembayaran yang kamu kirim, serta isi chat dengan admin, termasuk foto bukti bayar yang kamu lampirkan.','- Penyimpanan di perangkat: bahasa, tema, dan salinan data offline yang disimpan di browser perangkatmu agar aplikasi cepat dan tetap bisa dipakai saat sinyal lemah.']],
   ['2. Untuk apa data dipakai',['- Menjalankan fitur layanan, seperti menyimpan tugas, menyinkronkan data antar perangkat, dan menampilkan target serta ringkasan.','- Memverifikasi akun dan membantu atur ulang kata sandi.','- Mengelola masa percobaan dan langganan, termasuk memeriksa pembayaran.','- Menjawab pertanyaan, umpan balik, dan permintaan bantuan darimu.','- Menjaga keamanan layanan.','Kami tidak menjual data pribadi dan tidak memakai isi tugasmu untuk iklan.']],
   ['3. Tempat penyimpanan dan keamanan','Data disimpan di layanan Google Firebase (Authentication dan Cloud Firestore), sehingga server penyimpanannya bisa berada di luar Indonesia. Tugas dan profilmu hanya bisa dibuka oleh akunmu sendiri. Koneksi ke layanan dienkripsi dengan HTTPS.'],
   ['4. Berbagi data',['Kami hanya berbagi data dengan:','- Google, sebagai penyedia infrastruktur penyimpanan, login (termasuk masuk dengan Google), dan huruf (Google Fonts).','- GitHub, sebagai penyedia hosting halaman aplikasi (GitHub Pages).','- Pihak berwenang, bila diwajibkan oleh hukum.','Tombol Berbagi dengan teman hanya membuka aplikasi pilihanmu (misalnya WhatsApp, Telegram, atau email) dengan tautan Zui To-Do. Tugas dan profilmu tidak ikut dibagikan.','Admin Zui bisa melihat nama dan email akun, status langganan, permintaan pembayaran, dan chat yang kamu kirim. Tugas, kategori, target, dan profilmu tidak ditampilkan di panel admin. Pengelola teknis bisa membuka basis data lewat konsol Firebase hanya bila diperlukan untuk pemeliharaan atau saat kamu meminta bantuan.']],
   ['5. Hakmu','Kamu berhak meminta salinan data pribadimu, memperbaiki data yang salah, menghapus data, dan menarik persetujuan. Sebagian besar bisa kamu lakukan sendiri di aplikasi, seperti mengubah atau menghapus tugas dan profil, mengekspor tugas, dan mengunduh cadangan sesuai paket. Untuk permintaan lain, termasuk penghapusan akun, kirim email ke '+SUPPORT+'. Kami akan menanggapi paling lambat 14 hari kerja sejak permintaan diterima.'],
   ['6. Lama penyimpanan dan penghapusan','Data disimpan selama akunmu aktif. Tugas dan data profil yang kamu hapus di aplikasi langsung terhapus dari akunmu. Bila kamu meminta penghapusan akun, akun dan seluruh tugas, kategori, target, profil, dan pengaturanmu dihapus permanen dan tidak bisa dipulihkan. Catatan pembayaran langganan dan chat bantuan, termasuk bukti bayar, tetap kami simpan sesuai kewajiban pembukuan dan hukum, lalu dihapus setelah tidak diperlukan lagi. Salinan cadangan di penyedia infrastruktur, bila ada, terhapus permanen setelah waktu terbatas. Data yang tersimpan di browser perangkatmu bisa kamu hapus sendiri lewat pengaturan browser.'],
   ['7. Data orang lain dalam tugasmu','Bila kamu mencatat data orang lain di tugasmu, misalnya nama atau nomor telepon, kamu yang menentukan data tersebut dan bertanggung jawab atasnya. Kami memproses data itu atas namamu dan hanya untuk menjalankan layanan.'],
   ['8. Pengguna di bawah umur','Pengguna di bawah 18 tahun hanya boleh memakai layanan dengan persetujuan orang tua atau wali. Bila kamu orang tua atau wali dan mengetahui anakmu memberi data tanpa persetujuanmu, hubungi kami agar datanya bisa dihapus.'],
   ['9. Perubahan kebijakan','Bila kebijakan ini berubah, kami akan memperbarui tanggal berlaku dan memberi tahu perubahan penting di layanan atau lewat email.'],
   ['10. Hubungi kami','Pertanyaan atau permintaan soal data pribadi bisa dikirim ke '+SUPPORT+'. Alamat lengkap ada di Pengaturan → Kontak & Alamat.']

  refund:[

   ['','! Langganan yang sudah aktif bersifat final. Langganan tidak dapat dibatalkan dan pembayarannya tidak dapat dikembalikan, kecuali karena kesalahan pembayaran pada bagian 3.'],
   ['1. Coba dulu sebelum membayar','Setiap akun baru mendapat masa percobaan gratis 14 hari dengan semua fitur paket Bisnis, tanpa pembayaran. Kami menyarankan kamu memakai masa ini untuk memastikan layanan dan paket yang dipilih sesuai kebutuhan sebelum berlangganan.'],

   ['','Terma ini mengawal penggunaan aplikasi Zui To-Do (“perkhidmatan”) yang diuruskan oleh Zui System, PT. Zaor Utama Indonesia (“kami”). Dengan membuat akaun atau menggunakan perkhidmatan, anda bersetuju dengan terma ini.'],
   ['1. Perkhidmatan kami',['Zui To-Do ialah aplikasi web untuk mencatat dan mengatur tugas peribadi, yang disimpan dalam akaun anda dan disegerakkan di semua peranti tempat anda log masuk:','- Tugas: tajuk, catatan, keutamaan, kategori, tarikh akhir dan tugas bertempoh (harian, mingguan, bulanan, tahunan). Tugas bertempoh yang belum selesai diteruskan ke tempoh seterusnya sebagai tugas Sambungan.','- Paparan: Hari ini, Papan, Kalendar dan Ringkasan.','- Sasaran: sasaran tugas harian, mingguan, bulanan dan tahunan.','- Profil dan tema: profil peribadi, tema sedia ada dan reka tema sendiri (pelan tertentu).','- Data: eksport tugas ke CSV, serta sandar dan pulihkan data (JSON) mengikut pelan.','- Bantuan: chat dengan admin Zui dan permohonan langganan.','Kami boleh menambah, mengubah atau menghentikan ciri dari semasa ke semasa.']],
   ['2. Akaun dan keselamatan',['- Anda mesti berumur sekurang-kurangnya 18 tahun, atau mendapat persetujuan ibu bapa atau penjaga jika di bawah 18 tahun.','- Anda wajib memberikan nama dan e-mel yang betul supaya akaun boleh dipulihkan.','- Satu akaun untuk seorang pengguna. Jangan berkongsi akaun dengan orang lain.','- Jaga kerahsiaan kata laluan. Semua aktiviti dalam akaun anda menjadi tanggungjawab anda.','- Segera hubungi kami jika anda mengesyaki akaun anda digunakan orang lain.']],
   ['3. Pelan dan ciri',['Setiap akaun menggunakan salah satu pelan berikut:','- Starter: semua paparan (Hari ini, Papan, Kalendar, Ringkasan), sasaran harian hingga tahunan, segerak di semua peranti, 8 tema sedia ada dan sehingga 5 kategori.','- Pro: semua ciri Starter, kategori sehingga 50, reka tema sendiri (warna, fon, saiz teks, bucu) dan eksport tugas ke CSV.','- Bisnes: semua ciri Pro, sandar dan pulihkan data (JSON) dan keutamaan balasan chat admin.','Jika anda bertukar ke pelan yang lebih rendah, ciri yang tidak termasuk dalam pelan itu dikunci, tetapi data sedia ada kekal disimpan.']],
   ['4. Tempoh percubaan dan langganan',['- Akaun baharu mendapat tempoh percubaan percuma selama 14 hari dengan semua ciri pelan Bisnes.','- Selepas tempoh percubaan, anda boleh memilih pelan Starter, Pro atau Bisnes dengan tempoh 1 bulan, 6 bulan atau 1 tahun. Harga dikenakan bagi setiap akaun dan dipaparkan di Tetapan → Urus langganan dalam Rupiah atau Ringgit.','- Harga boleh berubah. Perubahan harga tidak menjejaskan tempoh langganan yang telah dibayar.','- Bayaran dibuat melalui QRIS (Rupiah) atau DuitNow (Ringgit) ke kod yang tertera di Urus langganan. Selepas membayar, tulis nombor rujukan daripada resit dan hantar melalui menu tersebut. Anda juga boleh menghantar foto resit melalui chat admin.','- Kami menyemak bayaran dan mengaktifkan langganan secara manual, biasanya dalam masa 1 × 24 jam. Masa pengaktifan bergantung pada waktu perkhidmatan dan tidak dijamin serta-merta. Tempoh aktif ditambah dari tarikh tamat semasa, atau dari hari pengaktifan jika tempoh aktif telah tamat.','- Langganan tidak diperbaharui secara automatik.','- Jika tempoh percubaan atau langganan tamat, terdapat tempoh tangguh 3 hari. Selepas itu tugas dan data hanya boleh dibaca dan tidak boleh diubah sehingga langganan aktif. Data kekal disimpan.','- Langganan yang telah aktif tidak boleh dibatalkan dan bayarannya tidak boleh dikembalikan, kecuali kerana kesilapan bayaran mengikut Dasar Bayaran Balik.']],
   ['5. Data milik anda','Data yang anda masukkan, seperti tugas, kategori, sasaran dan profil, kekal milik anda. Kami hanya menggunakannya untuk menjalankan perkhidmatan mengikut Dasar Privasi. Anda bertanggungjawab atas kandungan yang anda catat dan memastikan anda berhak menyimpannya, termasuk jika tugas anda mengandungi data orang lain. Kami mencadangkan anda menyandarkan data secara berkala.'],
   ['6. Penggunaan yang dilarang',['- Menggunakan perkhidmatan untuk menyimpan atau menyebarkan kandungan yang menyalahi undang-undang, atau memasukkan data pihak lain tanpa hak.','- Cuba membuka data pengguna lain, menceroboh keselamatan atau mengganggu perkhidmatan.','- Menghantar nombor rujukan atau resit yang dipalsukan, diubah atau digunakan semula.','- Menyalin, menjual semula atau menyewakan akses perkhidmatan tanpa kebenaran bertulis daripada kami.']],
   ['7. Ketersediaan perkhidmatan','Kami berusaha memastikan perkhidmatan sentiasa boleh digunakan, tetapi tidak menjamin bebas gangguan. Penyelenggaraan, kemas kini, gangguan rangkaian atau gangguan penyedia infrastruktur boleh menyebabkan perkhidmatan atau penyegerakan tidak tersedia buat sementara.'],
   ['8. Had tanggungjawab','Zui To-Do ialah alat bantu pencatatan. Peringatan, sasaran dan ringkasan dikira daripada data yang anda masukkan. Setakat yang dibenarkan undang-undang, kami tidak bertanggungjawab atas kerugian tidak langsung, kehilangan keuntungan, tugas atau tarikh akhir yang terlepas, atau kerugian akibat data yang salah. Jumlah tanggungjawab kami bagi satu pertikaian tidak melebihi jumlah yang anda bayar untuk langganan dalam 3 bulan terakhir.'],
   ['9. Penamatan','Anda boleh berhenti menggunakan perkhidmatan bila-bila masa dengan tidak memperbaharui langganan, memadam tugas dan data profil dalam aplikasi, atau meminta akaun dan semua datanya dipadam melalui '+SUPPORT+'. Kami boleh menggantung atau menutup akaun yang melanggar terma ini, dengan notis jika boleh.'],
   ['10. Perubahan terma','Kami boleh mengemas kini terma ini. Perubahan penting akan diumumkan dalam perkhidmatan atau melalui e-mel. Tarikh berkuat kuasa di atas menunjukkan versi terkini.'],
   ['11. Undang-undang yang terpakai','Terma ini tertakluk kepada undang-undang Republik Indonesia. Pertikaian diselesaikan terlebih dahulu secara musyawarah, dan jika tidak tercapai, melalui Pengadilan Negeri Pamekasan.'],
   ['12. Hubungi kami','Lihat Tetapan → Hubungi & Alamat.']
  ],
  privacy:[
   ['','Dasar ini menerangkan data yang dikumpul oleh Zui To-Do, tujuannya dan cara anda mengawalnya. Kami mematuhi Undang-Undang Nomor 27 Tahun 2022 tentang Pelindungan Data Pribadi (Indonesia).'],
   ['1. Data yang kami kumpul',['- Data akaun: nama, e-mel dan kata laluan. Kata laluan diurus oleh Firebase Authentication dan tidak boleh kami lihat. Jika anda log masuk dengan Google, kami menerima nama dan e-mel akaun Google anda.','- Profil (pilihan): nama penuh, nama panggilan, nama pengguna, tarikh lahir, jantina, telefon, bandar atau negara, pekerjaan, organisasi atau sekolah, bio, foto profil, sasaran tugas sehari dan waktu peringatan. Semua medan ini boleh dikosongkan.','- Data yang anda masukkan: tugas berserta catatan, keutamaan, tarikh akhir dan statusnya, kategori serta sasaran.','- Tetapan: bahasa, tema dan reka tema yang disimpan dalam akaun anda.','- Langganan dan bantuan: pelan, tempoh, jumlah, mata wang dan nombor rujukan bayaran yang anda hantar, serta kandungan chat dengan admin, termasuk foto resit yang anda lampirkan.','- Storan peranti: bahasa, tema dan salinan data luar talian yang disimpan dalam pelayar peranti anda supaya aplikasi pantas dan boleh digunakan ketika isyarat lemah.']],
   ['2. Tujuan penggunaan data',['- Menjalankan ciri perkhidmatan, seperti menyimpan tugas, menyegerakkan data antara peranti dan memaparkan sasaran serta ringkasan.','- Mengesahkan akaun dan membantu menetapkan semula kata laluan.','- Mengurus tempoh percubaan dan langganan, termasuk menyemak bayaran.','- Menjawab soalan, maklum balas dan permintaan bantuan anda.','- Menjaga keselamatan perkhidmatan.','Kami tidak menjual data peribadi dan tidak menggunakan kandungan tugas anda untuk iklan.']],
   ['3. Tempat penyimpanan dan keselamatan','Data disimpan dalam Google Firebase (Authentication dan Cloud Firestore), jadi pelayan penyimpanannya mungkin berada di luar Indonesia. Tugas dan profil anda hanya boleh dibuka oleh akaun anda sendiri. Sambungan ke perkhidmatan disulitkan dengan HTTPS.'],
   ['4. Perkongsian data',['Kami hanya berkongsi data dengan:','- Google, sebagai penyedia infrastruktur penyimpanan, log masuk (termasuk log masuk dengan Google) dan fon (Google Fonts).','- GitHub, sebagai penyedia hosting halaman aplikasi (GitHub Pages).','- Pihak berkuasa, jika diwajibkan oleh undang-undang.','Butang Kongsi dengan rakan hanya membuka aplikasi pilihan anda (contohnya WhatsApp, Telegram atau e-mel) dengan pautan Zui To-Do. Tugas dan profil anda tidak dikongsi.','Admin Zui boleh melihat nama dan e-mel akaun, status langganan, permohonan bayaran dan chat yang anda hantar. Tugas, kategori, sasaran dan profil anda tidak dipaparkan di panel admin. Pengurus teknikal boleh membuka pangkalan data melalui konsol Firebase hanya jika perlu untuk penyelenggaraan atau apabila anda meminta bantuan.']],
   ['5. Hak anda','Anda berhak meminta salinan data peribadi anda, membetulkan data yang salah, memadam data dan menarik balik persetujuan. Kebanyakannya boleh anda lakukan sendiri dalam aplikasi, seperti mengubah atau memadam tugas dan profil, mengeksport tugas dan memuat turun sandaran mengikut pelan. Untuk permintaan lain, termasuk pemadaman akaun, hantar e-mel ke '+SUPPORT+'. Kami akan menjawab dalam masa 14 hari bekerja selepas permintaan diterima.'],
   ['6. Tempoh penyimpanan dan pemadaman','Data disimpan selagi akaun anda aktif. Tugas dan data profil yang anda padam dalam aplikasi terus dipadam daripada akaun anda. Jika anda meminta pemadaman akaun, akaun dan semua tugas, kategori, sasaran, profil dan tetapan anda dipadam secara kekal dan tidak boleh dipulihkan. Rekod bayaran langganan dan chat bantuan, termasuk resit, disimpan mengikut kewajipan perakaunan dan undang-undang, kemudian dipadam apabila tidak diperlukan lagi. Salinan sandaran di penyedia infrastruktur, jika ada, dipadam secara kekal selepas tempoh terhad. Data dalam pelayar peranti anda boleh dipadam sendiri melalui tetapan pelayar.'],
   ['7. Data orang lain dalam tugas anda','Jika anda mencatat data orang lain dalam tugas anda, contohnya nama atau nombor telefon, anda yang menentukan data tersebut dan bertanggungjawab ke atasnya. Kami memproses data itu bagi pihak anda dan hanya untuk menjalankan perkhidmatan.'],
   ['8. Pengguna bawah umur','Pengguna di bawah 18 tahun hanya boleh menggunakan perkhidmatan dengan persetujuan ibu bapa atau penjaga. Jika anda ibu bapa atau penjaga dan mendapati anak anda memberikan data tanpa persetujuan anda, hubungi kami supaya data itu dipadam.'],
   ['9. Perubahan dasar','Jika dasar ini berubah, kami akan mengemas kini tarikh berkuat kuasa dan memaklumkan perubahan penting dalam perkhidmatan atau melalui e-mel.'],
   ['10. Hubungi kami','Soalan atau permintaan berkaitan data peribadi boleh dihantar ke '+SUPPORT+'. Alamat penuh ada di Tetapan → Hubungi & Alamat.']
  ],
  refund:[
   ['','Dasar ini menerangkan peraturan bayaran balik untuk bayaran langganan Zui To-Do.'],
   ['','! Langganan yang telah aktif adalah muktamad. Langganan tidak boleh dibatalkan dan bayarannya tidak boleh dikembalikan, kecuali kerana kesilapan bayaran di bahagian 3.'],
   ['1. Cuba dahulu sebelum membayar','Setiap akaun baharu mendapat tempoh percubaan percuma 14 hari dengan semua ciri pelan Bisnes, tanpa bayaran. Kami mencadangkan anda menggunakan tempoh ini untuk memastikan perkhidmatan dan pelan yang dipilih sesuai sebelum melanggan.'],
   ['2. Pelan dan harga',['Satu langganan untuk satu akaun.','{prices}','Harga yang terpakai ialah harga yang tertera di Urus langganan semasa anda memohon langganan, termasuk harga promosi jika ada. Langganan tidak diperbaharui secara automatik, jadi tiada caj berulang tanpa persetujuan anda.']],
   ['3. Pengecualian: kesilapan bayaran',['Bayaran balik hanya terpakai untuk kesilapan bayaran berikut, jika dimohon dalam masa 7 hari selepas bayaran:','- Bayaran berganda: anda membayar dua kali untuk permohonan yang sama. Lebihannya dikembalikan sepenuhnya.','- Lebihan bayaran: jumlah yang dibayar melebihi harga pelan. Bezanya dikembalikan.','- Langganan tidak diaktifkan: langganan belum aktif dalam 3 × 24 jam selepas anda menghantar nombor rujukan yang betul, dan anda memilih untuk membatalkan. Bayaran dikembalikan sepenuhnya.']],
   ['4. Bayaran yang tidak boleh dikembalikan',['- Langganan yang telah aktif, termasuk pembaharuan, atas apa jua sebab, contohnya berubah fikiran atau tidak lagi menggunakan perkhidmatan.','- Baki tempoh langganan jika anda berhenti menggunakan perkhidmatan di pertengahan tempoh.','- Pertukaran ke pelan yang lebih rendah atau tempoh yang lebih pendek semasa tempoh langganan.','- Akaun yang ditutup kerana melanggar Terma Perkhidmatan.','- Bayaran yang dihantar ke destinasi selain QRIS atau DuitNow yang tertera di Urus langganan.','- Permohonan dengan nombor rujukan atau resit yang dipalsukan, diubah atau digunakan semula.']],
   ['5. Cara memohon',['Hantar e-mel ke '+SUPPORT+' dengan tajuk “Bayaran Balik”, atau tulis melalui chat admin dalam Zui To-Do, dan sertakan:','- e-mel akaun,','- tarikh, jumlah dan nombor rujukan bayaran, serta resitnya,','- sebab permohonan,','- nama bank atau e-dompet, nombor akaun dan nama pemilik akaun untuk menerima dana.']],
   ['6. Proses dan masa',['- Kami membalas permohonan dalam masa 2 hari bekerja.','- Jika diluluskan, dana dihantar dalam 7 hingga 14 hari bekerja ke akaun bank atau e-dompet yang anda berikan.','- Bayaran balik kerana bayaran berganda atau lebihan bayaran tidak mengubah langganan yang telah aktif. Untuk langganan yang belum diaktifkan, permohonannya dibatalkan dan data dalam akaun anda kekal selamat.']]
  ],
  contact:[
   ['','Zui To-Do diuruskan oleh Zui System, PT. Zaor Utama Indonesia.'],
   ['Syarikat','PT. Zaor Utama Indonesia'],
   ['Alamat','Dsn. Togur Dajah, Sotabar, Pasean, Pamekasan, Jawa Timur 69356, Indonesia'],
   ['Bantuan & bayaran balik',SUPPORT],
   ['Maklumat am & kerjasama',INFO_MAIL],
   ['WhatsApp',WA_NUM],
   ['Waktu perkhidmatan','Setiap hari, 08.00–22.00 WIB (09.00–23.00 waktu Malaysia)'],
   ['Laman aplikasi','todo.zuisystem.com']
